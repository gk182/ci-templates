# File mẫu 1: Tự động Build APK & Artifact cho app Flutter đơn giản (Không tự động Deploy lên Store)
# Đường dẫn tạo trong project con: <repo-app>/.github/workflows/ci.yml

name: Mobile CI (Basic Build Only)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    uses: gk182/ci-templates/.github/workflows/mobile-ci.yml@main
    with:
      project_type: flutter
      flutter_version: "3.24.0"
      build_ios: false        # Đặt false nếu dự án chỉ cần Android
      run_deploy: false       # Không tự động deploy lên store/firebase
    secrets: inherit
