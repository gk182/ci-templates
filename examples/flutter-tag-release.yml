# File mẫu 3: Deploy khi gắn Tag Release (ví dụ: git tag v1.0.0)
# - Push thường hoặc PR: Chỉ chạy Lint/Test & Build file APK để kiểm tra.
# - Push Tag (v*.*.*): Mới tiến hành Deploy chính thức lên Store (Play Store & TestFlight).
# Đường dẫn tạo trong project con: <repo-app>/.github/workflows/ci.yml

name: Release Tag CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'  # Kích hoạt khi push tag dạng v1.0.0, v2.1.0-beta,...
  pull_request:
    branches: [main]

jobs:
  mobile-ci:
    uses: gk182/ci-templates/.github/workflows/mobile-ci.yml@main
    with:
      project_type: flutter
      flutter_version: "3.24.0"
      build_ios: ${{ startsWith(github.ref, 'refs/tags/v') }}
      run_deploy: ${{ startsWith(github.ref, 'refs/tags/v') }} # Chỉ deploy khi push Tag dạng v...
      deploy_target: play_internal # Hoặc testflight
    secrets: inherit
